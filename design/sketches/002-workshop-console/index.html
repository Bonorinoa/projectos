<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectOS — Workshop Console</title>
<style>
  :root {
    --bg:#14181a; --panel:#1b2123; --panel-2:#222a2c; --ink:#e8ece7; --muted:#93a29b;
    --rule:#2c3538; --rule-2:#3a464a; --accent:#6fc79a; --warn:#ffb35c; --danger:#e56a4e;
    --serif: ui-serif, Charter, "Iowan Old Style", Georgia, serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:13.5px; }
  .top { height:44px; background:var(--panel); border-bottom:1px solid var(--rule-2); display:flex; align-items:center; gap:12px; padding:0 16px; }
  .brand { font-family:var(--serif); font-size:15px; letter-spacing:.01em; color:#b8c4bd; }
  .brand i { color:var(--accent); }
  .filters { display:flex; gap:7px; }
  .filters button { font:inherit; font-size:12px; background:transparent; color:var(--muted); border:1px solid var(--rule-2); padding:4px 11px; border-radius:7px; cursor:pointer; }
  .filters button.on { background:var(--panel-2); color:var(--ink); border-color:var(--accent); }
  .grid { position:absolute; top:45px; bottom:0; left:0; right:0; display:grid; grid-template-columns:minmax(340px,5fr) minmax(420px,7fr); gap:14px; padding:16px; }
  article { background:var(--panel); border:1px solid var(--rule-2); border-radius:10px; display:flex; flex-direction:column; min-height:0; }
  article h2 { font-family:var(--serif); font-size:14.5px; padding:9px 13px; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:8px; }
  article h2 .k { font-size:10px; color:var(--muted); border:1px solid var(--rule-2); padding:1px 6px; border-radius:5px; }
  .row { display:flex; align-items:center; gap:9px; padding:8px 12px; border-bottom:1px solid var(--rule); cursor:pointer; }
  .row:hover { background:var(--panel-2); }
  .row.sel { background:var(--panel-2); outline:1px solid var(--accent); outline-offset:-1px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .dot.warn { background:var(--warn); } .dot.danger { background:var(--danger); } .dot.idle { background:#5b6462; }
  .t { width:13px; text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  .title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .title b { font-family:var(--serif); font-size:13px; }
  .meta { color:var(--muted); font-size:11px; font-family:var(--mono); }
  .traces { flex:1; overflow:auto; padding:0 13px; }
  .tr { display:grid; grid-template-columns:88px 1fr; gap:9px; padding:7px 4px; border-bottom:1px solid var(--rule); align-items:start; }
  .stamp { font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  .body { font-size:12.5px; line-height:1.45; }
  .body .chips { margin:4px 0 0; display:flex; gap:6px; flex-wrap:wrap; }
  .chips span { font-size:10.5px; font-family:var(--mono); border:1px solid var(--rule-2); border-radius:5px; padding:1px 7px; color:var(--muted); }
  .chips span.good { color:var(--accent); border-color:#3d7a5f; } .chips span.bad { color:var(--danger); border-color:#7a3f33; }
  .deny { background:rgba(229,106,78,.08); border:1px solid #7a3f33; border-radius:6px; padding:6px 9px; font-size:11.5px; color:var(--danger); font-family:var(--mono); margin:5px 0 1px; }
  footer { color:var(--muted); font-size:11px; padding:7px 13px; border-top:1px solid var(--rule); }
</style>
</head>
<body>
<div class="top"><div class="brand">Project<i>OS</i> console</div>
  <div class="filters">
    <button class="on" data-f="all">All</button><button data-f="substack">Substack</button><button data-f="software">Software</button><button data-f="academic">Academic</button><button data-f="learning">Learning</button>
  </div>
</div>
<div class="grid">
  <article id="reg">
    <h2>Registry <span class="k">7 projects · 4 types</span></h2>
    <div id="list"></div>
    <footer>Path is a local binding. UUID is the identity. Move a folder — ProjectOS reconnects.</footer>
  </article>
  <article id="tr">
    <h2>Trace <span class="k" id="trk">live</span></h2>
    <div class="traces" id="traces"></div>
  </article>
</div>
<script>
const P=[
 {id:"p_sub_attn",type:"substack",name:"The economics of attention…",dot:"",t:"✎",meta:"rev 3 · draft",
  logs:[["14:02:11","action rephrase · route openrouter/deepseek-v4.1-flash",[["accepted",1],["cost","$0.0023"],["rev","0017"]],""],
         ["13:58:40","milestone locked: “argument locked”",[["snapshot","09c1"]],"Too many editors spoil the argum…"]]},
 {id:"p_sw_helix",type:"software",name:"helix-broker — capability broker",dot:"danger",t:"◉",meta:"gate C2 · failing",
  logs:[["14:09:52","probe run: app-sandbox child-fork",[["file","EPERM ✓"],["net","EPERM ✓"],["child","FORKED ✗"]],
        "APP SANDBOX still executes /bin/sh. Kept open as evidence; no claim of a boundary."],
        ["13:40:15","50,000 swap reads",[["escapes","0"]],"descriptor-relative broker clean vs symlink race."]]},
 {id:"p_ac_cult",type:"academic",name:"Culture–hierarchy measurement",dot:"warn",t:"Σ",meta:"γ=0.41 [0.33,0.50]",
  logs:[["12:21:33","claim: shared-value hierarchy",[["direct","3"],["partial","2"],["contra","1"]],
        "contradiction from literature matrix row 41 — surfaced, not hidden.⊘"]]},
 {id:"p_lf_rust",type:"learning",name:"Rust for economists",dot:"idle",t:"≔",meta:"notes · ch.4",
  logs:[["11:05:09","selected-text proposal: “what is a lifetime”",[["mode","propose"],["status","stored"]],
        "No mutation without acceptance. Proposal hash 7fe2.”"]]}
];
const list=document.getElementById('list'),traces=document.getElementById('traces');
let cur=0,filter='all';
function paint(){ list.innerHTML=""; P.forEach((p,i)=>{ if(filter!=='all'&&p.type!==filter)return;
  const d=p.dot==='danger'?'danger':(p.dot==='warn'?'warn':'');
  list.insertAdjacentHTML('beforeend',`<div class="row ${i===cur?'sel':''}" data-i="${i}"><span class="dot ${d}"></span><span class="t">${p.t}</span><span class="title"><b>${p.name}</b></span><span class="meta">${p.meta}</span></div>`); });
  document.querySelectorAll('#list .row').forEach(r=>r.onclick=()=>{cur=+r.dataset.i;paint();});
  traces.innerHTML=''; P[cur].logs.forEach(l=>{
  const chips=l[2].map(c=>`<span class="good">${c[0]} ${c[1]}</span>`).join('')+(l[3]?`<div class="deny">${l[3]}</div>`:'');
  traces.insertAdjacentHTML('beforeend',`<div class="tr"><span class="stamp">${l[0]}</span><div class="body">${l[1]}<div class="chips">${chips}</div></div></div>`); });
  document.getElementById('trk').textContent=P[cur].name.slice(0,34); }
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filter=b.dataset.f; paint(); });
paint();
</script>
</body>
</html>
