<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectOS — Canvas · Quiet Laboratory</title>
<style>
:root{
  --canvas:#0f1215; --grid:#1a2026; --chrome:#161c21; --chrome2:#1e262d; --ink:#e8edf0; --muted:#8fa0ab;
  --paper:#eef0ec; --paper2:#f7f8f4; --serif:ui-serif,Charter,"Iowan Old Style",Georgia,serif;
  --ui:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --mono:ui-monospace,Consolas,monospace;
  --t-Draft:#b07f2e; --t-Receipt:#7d8b94; --t-Evidence:#4a7c59; --t-Scope:#3f6f8f; --t-Recipe:#7a5f9e; --t-Revision:#8f6a3a;
  --accent:#5f9ac0; --edge:#46545e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:13px}
.tokens{position:fixed;top:0;left:0;right:0;height:42px;background:var(--chrome);border-bottom:1px solid #26313a;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:30}
.tokens .brand{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;color:#c6d4db}
.tokens .brand i{color:var(--accent);font-style:normal}
.chip{width:13px;height:13px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-2px}
.lens{margin-left:auto;display:flex;gap:6px}
.lens button{font:inherit;font-size:11px;background:transparent;color:var(--muted);border:1px solid #2a363f;padding:3px 10px;border-radius:5px;cursor:pointer}
.lens button.on{background:#1f2a32;color:var(--ink);border-color:var(--accent)}
#cv{position:fixed;top:42px;left:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#12181d 0%,#0e1216 55%,#0b0e11 100%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;opacity:.5}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#svg line{stroke:var(--edge);stroke-width:1;stroke-dasharray:2 3;opacity:.55}
#svg text.rel{fill:var(--muted);font-family:var(--mono);font-size:8.5px;letter-spacing:.05em}
#world{position:absolute;top:0;left:0;transform-origin:0 0}
.node{position:absolute;width:222px;background:var(--paper);color:#1b2226;border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.5),0 10px 0 rgba(0,0,0,.34);cursor:grab;transform:translate(-50%,-50%);border-left:3px solid #9aa3a8}
.node:hover{box-shadow:0 2px 0 rgba(0,0,0,.5),0 0 0 1px var(--accent)}
.node .hd{display:flex;align-items:center;gap:7px;padding:6px 9px 4px;border-bottom:1px solid rgba(27,34,38,.1)}
.node .badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:1px 5px;color:#fff}
.t-Draft{border-left-color:var(--t-Draft)} .t-Receipt{border-left-color:var(--t-Receipt)} .t-Evidence{border-left-color:var(--t-Evidence)}
.t-Scope{border-left-color:var(--t-Scope)} .t-Recipe{border-left-color:var(--t-Recipe)} .t-Revision{border-left-color:var(--t-Revision)}
.node .tt{font-size:12.5px;padding:6px 9px 2px;line-height:1.25;font-weight:600}
.node .sub{font-size:9.5px;color:#5e6a70;padding:2px 9px 6px;font-family:var(--mono)}
.node .ports{display:flex;justify-content:space-between;padding:0 5px 3px;font-size:14px;color:#6d7a81}
.port{cursor:crosshair;padding:0 4px;border-radius:3px}
.port:hover{background:#d9ddda}
#insp{position:fixed;top:42px;right:0;bottom:0;width:304px;background:var(--chrome);border-left:1px solid #26313a;padding:13px;transform:translateX(324px);transition:transform .22s;z-index:20;overflow:auto}
#insp h3{font-size:13.5px;color:var(--paper2);margin-bottom:3px;font-weight:600}
#insp .typ{font-family:var(--mono);font-size:9px;color:var(--accent);letter-spacing:.12em}
table{border-collapse:collapse;width:100%;margin:9px 0;font-size:11px}
td{border-bottom:1px solid #24303a;padding:4px 3px;vertical-align:top}
td.k{color:var(--muted);width:36%;font-family:var(--mono);font-size:9px}
#insp .rels{font-size:10px;color:var(--muted);font-family:var(--mono);line-height:1.6}
.zoom{position:fixed;bottom:14px;right:14px;display:flex;gap:5px;z-index:30}
.zoom button{font:inherit;width:24px;height:24px;border-radius:5px;border:1px solid #2a363f;background:var(--chrome);color:var(--muted);cursor:pointer}
.tokens .hash{font-family:var(--mono);font-size:9.5px;color:#5d6f79}
</style>
</head>
<body>
<div class="tokens"><span class="brand">Project<i>OS</i> · QUIET LAB</span>
  <span><span class="chip" style="background:#eef0ec"></span>paper</span><span><span class="chip" style="background:#1e262d"></span>slate</span><span><span class="chip" style="background:#5f9ac0"></span>blue</span><span class="hash">v0.1 · schema 03</span>
  <div class="lens"><button class="on" data-l="all">All</button><button data-l="lineage">Lineage</button><button data-l="evidence">Evidence</button><button data-l="workflow">Workflow</button></div>
</div>
<div id="cv"><div id="grid"></div><svg id="svg"></svg><div id="world"></div></div>
<div id="insp"><h3 id="i-title">—</h3><div class="typ" id="i-type"></div><table id="i-fields"></table><div class="rels" id="i-rels"></div></div>
<div class="zoom"><button id="zin">+</button><button id="zout">−</button></div>
<script>
const NODES=[
 {id:"d1",type:"Draft",title:"attention-twelfths.md",sub:"Substack · rev 3",x:330,y:200,fields:{anchor:"argument locked",milestone:"09c1",state:"accepted rev 0017",stale:false}},
 {id:"r1",type:"Receipt",title:"receipt 0017",sub:"Rephrase · run 2f4a",x:720,y:150,fields:{route:"openrouter/deepseek-v4.1-flash",cost:"0.0023",verdict:"accepted",outcome:"revision created"}},
 {id:"g1",type:"Evidence",title:"lineage-map.json",sub:"rev 0015→0017",x:1110,y:120,fields:{direct:3,partial:1,contra:0,pinned:"09c1"}},
 {id:"s1",type:"Scope",title:"scope.toml",sub:"premise + promise",x:1180,y:430,fields:{promise:"measurable units mislead",audience:"applied economists"}},
 {id:"r2",type:"Recipe",title:"structural-review.c4",sub:"block D · approved",x:500,y:470,fields:{blocks:"argument|evidence|flow",status:"approved",budget:"$0.05"}},
 {id:"e1",type:"Evidence",title:"q1-estimate.json",sub:"γ=0.41 [0.33,0.50]",x:900,y:560,fields:{dataset:"SCHWARTZ-2019",n:58,contra:false}},
 {id:"v1",type:"Revision",title:"rev-0017.diff",sub:"9c02 ← 1a3f",x:150,y:520,fields:{before:"1a3f",after:"9c02",status:"committed"}},
];
const RELS=[{f:"d1",t:"r1",l:"PRODUCED_BY"},{f:"r1",t:"g1",l:"SUPPORTS"},{f:"d1",t:"g1",l:"CITES"},{f:"d1",t:"s1",l:"GOVERNED_BY"},{f:"d1",t:"r2",l:"EXECUTED"},{f:"r2",t:"e1",l:"PRODUCED"},{f:"v1",t:"d1",l:"REVISION_OF"},{f:"r2",t:"v1",l:"APPLIED_TO"}];
const world=document.getElementById('world'),svg=document.getElementById('svg'),insp=document.getElementById('insp');
let z=1,sel=null,drag=null,linkC=null,lens="all";
const byId={};NODES.forEach(n=>{byId[n.id]=n;const el=document.createElement('div');el.className='node t-'+n.type;el.style.left=n.x+'px';el.style.top=n.y+'px';
 el.innerHTML=`<div class="hd"><span class="badge">${n.type.toUpperCase()}</span><span class="sub" style="margin-left:auto">${n.sub}</span></div><div class="tt">${n.title}</div><div class="ports"><span class="port p-in">◉</span><span class="port p-out">◉</span></div>`;
 el.dataset.id=n.id;
 el.addEventListener('mousedown',ev=>{if(ev.target.classList.contains('port'))return;sel=n.id;drag={el,dx:ev.offsetX,dy:ev.offsetY};showInsp();});
 el.addEventListener('mouseup',()=>drag=null);
 el.querySelector('.p-out').addEventListener('mousedown',ev=>{ev.stopPropagation();linkC={f:n.id,ex:el.offsetLeft+222,ey:el.offsetTop+16};window.addEventListener('mousemove',mv);window.addEventListener('mouseup',mu);});
 el.querySelector('.p-in').addEventListener('mouseup',ev=>{ev.stopPropagation();if(linkC&&linkC.f!==n.id){RELS.push({f:linkC.f,t:n.id,l:"LINKS_TO"});}linkC=null;});
 el.addEventListener('dblclick',()=>{sel=n.id;showInsp();});
 world.appendChild(el);el._el=el;});
function mv(ev){const r=world.getBoundingClientRect();svg.innerHTML=`<line x1="${linkC.ex}" y1="${linkC.ey}" x2="${ev.clientX-r.left}" y2="${ev.clientY-r.top}"></line>`;}
function mu(){linkC=null;svg.innerHTML="";window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',mu);paint();}
document.addEventListener('mouseup',()=>{drag=null;});
document.getElementById('cv').addEventListener('mousemove',ev=>{if(drag){drag.el.style.left=(ev.clientX-drag.dx)+'px';drag.el.style.top=(ev.clientY-drag.dy)+'px';}if(linkC){const r=world.getBoundingClientRect();svg.innerHTML=`<line x1="${linkC.ex}" y1="${linkC.ey}" x2="${ev.clientX-r.left}" y2="${ev.clientY-r.top}"></line>`;}paintLines();});
function relFor(id){return RELS.filter(r=>r.f===id||r.t===id);}
function visible(id){if(lens==="all")return true;const n=byId[id];if(lens==="evidence")return n.type==="Evidence";if(lens==="workflow")return ["Recipe","Receipt","Revision"].includes(n.type);if(lens==="lineage"){return n.type==="Draft"||relFor(id).some(r=>{const o=byId[r.f===id?r.t:r.f];return o&&o.type!=="Receipt";});}return true;}
function paint(){NODES.forEach(n=>{n._el.style.display=visible(n.id)?"":"none";});paintLines();}
function paintLines(){svg.innerHTML="";RELS.forEach(rel=>{const a=byId[rel.f]._el,b=byId[rel.t]._el;if(!a||!b||a.style.display==="none"||b.style.display==="none")return;
 const ax=a.offsetLeft+a.offsetWidth,ay=a.offsetTop+16,bx=b.offsetLeft,by=b.offsetTop+16;
 svg.innerHTML+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"></line><text class="rel" x="${(ax+bx)/2}" y="${(ay+by)/2}">${rel.l}</text>`;});}
function showInsp(){const n=byId[sel];if(!n)return;insp.style.transform='translateX(0)';document.getElementById('i-title').textContent=n.title;document.getElementById('i-type').textContent=n.type.toUpperCase()+' · '+n.sub;const f=document.getElementById('i-fields');f.innerHTML='';Object.entries(n.fields).forEach(([k,v])=>{f.insertAdjacentHTML('beforeend',`<tr><td class="k">${k}</td><td>${v}</td></tr>`);});const rs=relFor(sel).map(r=>r.f===sel?`${r.l} → ${byId[r.t].title}`:`← ${r.l} · ${byId[r.f].title}`).join('<br>');document.getElementById('i-rels').innerHTML=rs||'(no relations)';}
document.querySelectorAll('.lens button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lens button').forEach(x=>x.classList.remove('on'));b.classList.add('on');lens=b.dataset.l;paint();});
document.getElementById('zin').onclick=()=>{z=Math.min(z*1.15,2);world.style.transform=`scale(${z})`;paintLines();};
document.getElementById('zout').onclick=()=>{z=Math.max(z/1.15,.5);world.style.transform=`scale(${z})`;paintLines();};
paint();
</script>
</body>
</html>
