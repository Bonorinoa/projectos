[package]
name = "projectos-app"
version = "0.0.1"
edition = "2021"
rust-version = "1.97.1"
description = "ProjectOS desktop app shell (Tauri v2)"
license = "Apache-2.0"
publish = false

# STANDALONE crate: deliberately NOT part of a workspace root.
[[bin]]
name = "projectos-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
projectos-kernel = { path = "../../kernel" }

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
strip = true
