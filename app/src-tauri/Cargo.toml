[package]
name = "projectos-app"
version = "0.0.1"
edition = "2021"
rust-version = "1.97.1"
description = "ProjectOS desktop app shell (Tauri v2)"
license = "Apache-2.0"
publish = false

# STANDALONE crate: deliberately NOT part of a workspace root.
[[bin]]
name = "projectos-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
projectos-kernel = { path = "../../kernel" }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"
zeroize = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

# The pinned macOS MockRuntime needs this test-only feature to implement the
# current runtime's WindowBuilder trait. Production dependencies stay unchanged.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tauri = { version = "=2.12.0", features = ["test", "macos-private-api"] }

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
tauri = { version = "=2.12.0", features = ["test"] }

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
strip = true
