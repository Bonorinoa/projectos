<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectOS — Synodos Field</title>
<!-- Design tokens (locked single source) -->
<link rel="stylesheet" href="tokens.css">
<!-- Vendored fonts via RELATIVE paths — no CDN, no network. -->
<style>
@font-face{font-family:"Geist";src:url("../assets/fonts/geist/Geist[wght].ttf") format("truetype");font-weight:100 900;font-display:swap;}
@font-face{font-family:"Space Mono";src:url("../assets/fonts/space-mono/SpaceMono-Regular.ttf") format("truetype");font-weight:400;font-display:swap;}
@font-face{font-family:"Space Mono";src:url("../assets/fonts/space-mono/SpaceMono-Bold.ttf") format("truetype");font-weight:700;font-display:swap;}

/* ---- Synodos Field component styles (uses tokens.css variables) ------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;background:var(--pos-field);color:var(--pos-ink);font-family:var(--pos-font-ui);font-size:13px}

/* top chrome bar */
.tokens{position:fixed;top:0;left:0;right:0;height:46px;background:var(--pos-chrome);color:var(--pos-field);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:30;border-bottom:3px solid var(--pos-chrome-2)}
.tokens .brand{font-family:var(--pos-font-mono);font-weight:700;letter-spacing:.14em;font-size:12px;white-space:nowrap}
.tokens .brand i{color:var(--pos-gold);font-style:normal}
.chip{width:13px;height:13px;display:inline-block;margin-right:4px;vertical-align:-2px;border:1px solid rgba(0,0,0,.5);border-radius:2px}
.kicker{font-family:var(--pos-font-mono);font-size:8.5px;letter-spacing:.16em;color:#b9b3a4;white-space:nowrap}
.lens{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.lens button,.ctl button{font-family:var(--pos-font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--pos-field);color:var(--pos-ink);border:1px solid var(--pos-ink);border-radius:3px;padding:4px 9px;cursor:pointer;box-shadow:2px 2px 0 var(--pos-chrome-2)}
.lens button.on{background:var(--pos-gold);color:var(--pos-chrome-2);box-shadow:2px 2px 0 var(--pos-chrome-2)}
.lens button:active,.ctl button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--pos-chrome-2)}
.ctl{display:flex;gap:6px;align-items:center}
.ctl select{font-family:var(--pos-font-mono);font-size:9.5px;background:var(--pos-field);color:var(--pos-ink);border:1px solid var(--pos-ink);border-radius:3px;padding:4px 6px;box-shadow:2px 2px 0 var(--pos-chrome-2)}
.ctl button.a11y.on{background:var(--pos-rust);color:var(--pos-field)}
.sep{width:1px;align-self:stretch;background:rgba(236,229,216,.25);margin:0 2px}

/* canvas field */
#cv{position:fixed;top:46px;left:0;right:0;bottom:0;overflow:hidden;background-color:var(--pos-field);background-image:var(--pos-dither);background-size:8px 8px}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#svg line{stroke:var(--pos-ink);stroke-width:1.6;stroke-dasharray:2 3;stroke-linecap:butt;opacity:.55}
#svg text.rel{fill:var(--pos-ink);font-family:var(--pos-font-mono);font-size:8px;letter-spacing:.06em;opacity:.75}
#world{position:absolute;top:0;left:0;transform-origin:0 0}

.node{position:absolute;width:var(--pos-node-w);background:var(--pos-surface);border:1px solid var(--pos-ink);border-radius:var(--pos-radius);box-shadow:var(--pos-shadow);cursor:grab;transform:translate(-50%,-50%);transition:box-shadow .12s,transform .12s}
.node:hover,.node:focus{box-shadow:var(--pos-shadow-hover);outline:none}
.node:focus-visible{border-color:var(--pos-rust)}
.node .hd{display:flex;align-items:center;gap:8px;padding:7px 10px 6px;border-bottom:1px dashed var(--pos-line)}
.node .hd .sp{flex:0 0 auto;image-rendering:pixelated}
.node .badge{font-family:var(--pos-font-mono);font-size:8px;letter-spacing:.14em;color:var(--pos-ink2);background:var(--pos-field);border:1px solid var(--pos-ink);padding:2px 6px;border-radius:var(--pos-radius-chip)}
.node .sub{margin-left:auto;font-family:var(--pos-font-mono);font-size:8px;color:var(--pos-muted);letter-spacing:.02em}
.node .tt{font-size:var(--pos-fs-title);font-weight:600;padding:8px 10px 3px;line-height:1.25;letter-spacing:-.01em}
.node .meta{font-family:var(--pos-font-mono);font-size:var(--pos-fs-meta);color:var(--pos-muted);padding:2px 10px 8px}
.node .ports{display:flex;justify-content:space-between;padding:0 6px 5px}
.port{width:var(--pos-port);height:var(--pos-port);border:1px solid var(--pos-ink);background:var(--pos-field);border-radius:2px;cursor:crosshair;image-rendering:pixelated}
.port:hover,.port.hot{background:var(--pos-gold)}

/* a11y list view */
#listpanel{position:fixed;top:46px;left:0;right:0;bottom:0;overflow:auto;background:var(--pos-field);background-image:var(--pos-dither);background-size:8px 8px;padding:18px 22px 40px}
#listpanel table{width:100%;max-width:1180px;border-collapse:collapse;font-family:var(--pos-font-mono);font-size:11.5px;background:var(--pos-surface);border:1px solid var(--pos-ink);box-shadow:var(--pos-shadow)}
#listpanel caption{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pos-muted);padding:0 2px 8px;font-family:var(--pos-font-mono)}
#listpanel th{font-family:var(--pos-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--pos-field);background:var(--pos-chrome);padding:8px 10px;border-bottom:2px solid var(--pos-chrome-2);white-space:nowrap}
#listpanel td{border-bottom:1px dashed var(--pos-line);padding:8px 10px;vertical-align:top}
#listpanel tr:hover{background:rgba(199,154,82,.12)}
#listpanel tr:focus{outline:none;background:rgba(199,154,82,.22);box-shadow:inset 0 0 0 2px var(--pos-gold)}
#listpanel tr:focus-visible{outline:none;background:rgba(199,154,82,.22);box-shadow:inset 0 0 0 2px var(--pos-gold)}
.td-type{font-family:var(--pos-font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.td-kind .dot{display:inline-block;width:10px;height:10px;margin-right:6px;border:1px solid var(--pos-ink);border-radius:2px;vertical-align:-1px}
.td-rel{font-size:10px;line-height:1.6;color:var(--pos-ink);white-space:nowrap}
.td-rel b{color:var(--pos-rust);font-weight:700}
.lrowkey{font-size:9.5px;color:var(--pos-muted);letter-spacing:.04em}

/* inspector */
#insp{position:fixed;top:46px;right:0;bottom:0;width:318px;background:var(--pos-surface);border-left:3px solid var(--pos-ink);padding:14px;transform:translateX(340px);transition:transform .2s;z-index:20;overflow:auto}
#insp.open{transform:translateX(0)}
#insp .ihead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
#insp h3{font-size:14px;line-height:1.3}
#insp .typ{font-family:var(--pos-font-mono);font-size:9px;letter-spacing:.14em;color:var(--pos-rust);margin-bottom:8px;text-transform:uppercase}
#insp table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-family:var(--pos-font-mono);font-size:10px}
#insp td{border-bottom:1px dashed var(--pos-line);padding:5px 3px;vertical-align:top}
#insp td.k{color:var(--pos-muted);width:42%}
.rels{font-family:var(--pos-font-mono);font-size:10px;line-height:1.8}
.rels .arrow{color:var(--pos-rust);font-weight:700}
#insp .close{float:right;font-family:var(--pos-font-mono);font-size:11px;background:var(--pos-field);border:1px solid var(--pos-ink);border-radius:3px;padding:2px 7px;cursor:pointer;box-shadow:2px 2px 0 var(--pos-chrome-2)}
#insp .close:active{transform:translate(2px,2px);box-shadow:none}

.zoom{position:fixed;bottom:16px;right:16px;display:flex;gap:8px;z-index:30}
.zoom button{font-family:var(--pos-font-mono);font-size:14px;background:var(--pos-field);color:var(--pos-ink);border:1px solid var(--pos-ink);border-radius:3px;width:30px;height:30px;padding:0;cursor:pointer;box-shadow:2px 2px 0 var(--pos-chrome-2)}
.zoom button:active{transform:translate(2px,2px);box-shadow:none}
.hint{position:fixed;left:16px;bottom:16px;font-family:var(--pos-font-mono);font-size:9px;color:var(--pos-muted);letter-spacing:.06em;z-index:30;padding-right:80px}

/* reduced motion respected */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="tokens">
  <span class="brand">PROJECT<i>OS</i> · SYNODOS FIELD</span>
  <span class="kicker">GRID 8 · SPRITES 12×12 · RADIUS 6</span>
  <div class="ctl">
    <label for="relkind" class="kicker">LINK</label>
    <select id="relkind" aria-label="Relation kind for port-to-port links">
      <option value="SUPPORTS">SUPPORTS</option>
      <option value="CITES">CITES</option>
      <option value="GOVERNED_BY">GOVERNED_BY</option>
      <option value="EXECUTED">EXECUTED</option>
      <option value="PRODUCED">PRODUCED</option>
      <option value="PRODUCED_BY">PRODUCED_BY</option>
      <option value="REVISION_OF">REVISION_OF</option>
      <option value="APPLIED_TO">APPLIED_TO</option>
      <option value="LINKS_TO" selected>LINKS_TO</option>
    </select>
  </div>
  <div class="lens">
    <button class="on" data-l="all" aria-pressed="true">All</button>
    <button data-l="lineage" aria-pressed="false">Lineage</button>
    <button data-l="evidence" aria-pressed="false">Evidence</button>
    <button data-l="workflow" aria-pressed="false">Workflow</button>
  </div>
  <div class="sep"></div>
  <div class="ctl">
    <button id="listtoggle" class="a11y" aria-pressed="false">List (A)</button>
  </div>
</div>

<div id="cv">
  <svg id="svg" aria-hidden="true"></svg>
  <div id="world"></div>
</div>

<!-- A11Y LIST-EQUIVALENT: the same records as a semantic table -->
<section id="listpanel" hidden aria-label="Artifact list — equivalent of the canvas">
  <table>
    <caption>Artifacts on the field — same records as the canvas</caption>
    <thead>
      <tr><th scope="col">Type</th><th scope="col">Artifact</th><th scope="col">Key fields</th><th scope="col">Relations</th></tr>
    </thead>
    <tbody id="listbody"></tbody>
  </table>
</section>

<div id="insp" role="dialog" aria-label="Artifact inspector" aria-hidden="true">
  <button class="close" id="inspclose" aria-label="Close inspector">✕</button>
  <div class="ihead"><span id="i-sprite"></span><div><h3 id="i-title">—</h3><div class="typ" id="i-type"></div></div></div>
  <table id="i-fields"></table>
  <div class="rels" id="i-rels"></div>
  <div class="lrowkey" style="margin-top:12px">REL-FIELDS · REDACTED · TYPED</div>
</div>

<div class="zoom">
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zin" aria-label="Zoom in">+</button>
</div>
<div class="hint">DRAG NODE · DRAG ■ OUT-PORT → IN-PORT TO LINK · 2×CLICK INSPECTOR · TAB+ARROWS NAV · ENTER INSPECT · ESC CLOSE · A = LIST</div>

<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
