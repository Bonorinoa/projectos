[package]
name = "projectos-graph-embedding"
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
# Vendored fork at the same upstream rev, AGPL-3.0 helix-metrics crate stripped.
# See vendor/helix-db/VENDOR.md and evidence/gates/gate-b/license-screen-helix-metrics.md.
helix-db = { path = "../../../vendor/helix-db/sdks/rust", features = ["embedded"] }
helix-core-db = { package = "db", path = "../../../vendor/helix-db/crates/db" }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros"] }
tempfile = "=3.27.0"
tauri = { version = "=2.12.0", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "=2.7.0", optional = true , features = [] }

[features]
desktop = ["dep:tauri", "dep:tauri-build", "tauri/custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
